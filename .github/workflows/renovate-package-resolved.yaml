name: Update Package.resolved for Renovate

on:
  push:
    branches:
      - "renovate/**"

jobs:
  update-package-resolved:
    # Must match the Xcode that Xcode Cloud archives with, otherwise the committed
    # Package.resolved is missing pins and every Xcode Cloud run fails resolution.
    runs-on: xcode-27
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run swift package resolve
        run: swift package resolve

      - name: Resolve package dependencies for iOS apps
        run: |
          set -euo pipefail
          cd "Apps/FlowKitAdapter" && xcodebuild -project "FlowKit Adapter.xcodeproj" -scheme "FlowKit Adapter" -resolvePackageDependencies
          cd ../..
          cd "Apps/FlowKitController" && xcodebuild -project "FlowKit Controller.xcodeproj" -scheme "FlowKit Controller" -resolvePackageDependencies

      - name: Check for changes in Package.resolved
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet Package.resolved "Apps/FlowKitAdapter/FlowKit Adapter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" "Apps/FlowKitController/FlowKit Controller.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Package.resolved changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Package.resolved "Apps/FlowKitAdapter/FlowKit Adapter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" "Apps/FlowKitController/FlowKit Controller.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          git commit -m "Package.resolved updated"
          git push

      - name: Trigger PR checks
        # The commit pushed above uses GITHUB_TOKEN, which GitHub deliberately
        # prevents from triggering further workflow runs. Without this the PR
        # checks never run against the regenerated Package.resolved. Dispatch
        # them explicitly (workflow_dispatch is exempt from that restriction).
        # Runs even when Package.resolved did not change: pr-checks.yml now
        # skips its own pull_request run on renovate/** branches, so without
        # this dispatch such a PR would get no checks at all.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pr-checks.yml --ref "${{ github.ref_name }}"
