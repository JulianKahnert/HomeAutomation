openapi: "3.1.0"

info:
  title: HomeAutomationServer API
  version: 0.0.4
  description: This is the API documentation for the HomeAutomationServer API. It provides endpoints to manage automations, push devices, and window states, etc.

servers:
  - url: http://localhost:8080
    description: Local deployment of the server

paths:
  /config/automations:
    get:
      summary: Get all automations
      description: Retrieve a list of all available automations.
      operationId: getAutomations
      responses:
        "200":
          description: A success response with all available automations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"

  /config/automations/{name}/activate:
    post:
      summary: Activate an automation
      description: Activate a specific automation by name.
      operationId: activateAutomation
      parameters:
        - name: name
          in: path
          description: Name of the automation
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The automation was activated.

  /config/automations/{name}/deactivate:
    post:
      summary: Deactivate an automation
      description: Deactivate a specific automation by name.
      operationId: deactivateAutomation
      parameters:
        - name: name
          in: path
          description: Name of the automation
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The automation was deactivated.

  /config/automations/{name}/stop:
    post:
      summary: Stop a running automation
      description: Stop a currently running automation by name.
      operationId: stopAutomation
      parameters:
        - name: name
          in: path
          description: Name of the automation
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The currently running automation was stopped or the automation is not running.

  /config/automations/{name}/runs:
    get:
      summary: Get the runs of an automation
      description: Retrieve the recorded runs of one automation, newest first.
      operationId: getAutomationRuns
      parameters:
        - name: name
          in: path
          description: Name of the automation
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: ISO 8601 timestamp; only runs started at or after it
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: ISO 8601 timestamp; only runs started before it
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of runs to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The runs of the automation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRun"

  /runs:
    get:
      summary: Get recent runs
      description: Retrieve the runs of all automations started since a date, newest first.
      operationId: getRecentRuns
      parameters:
        - name: since
          in: query
          description: ISO 8601 timestamp; only runs started at or after it
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of runs to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The recent runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRun"

  /pushdevices:
    post:
      summary: Register a push device
      description: Register a new device for push notifications.
      operationId: registerPushDevice
      requestBody:
        description: New device to register for push notifications.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDevice"
      responses:
        "200":
          description: The device was registered for push notifications.

        "500":
          description: Some internal server error.

  /windowstates:
    get:
      summary: Get window states
      description: >-
        Retrieve the open windows as the window Live Activity shows them: überschritten windows first,
        then by the time they have to be closed (Fensterschließzeit), window name as tiebreak. The list
        is capped at 20 windows; the counts and the stale date cover all open windows.
      operationId: getWindowStates
      responses:
        "200":
          description: A success response with the open windows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowStates:
                    type: array
                    description: At most 20 open windows, in the order described above.
                    items:
                      $ref: "#/components/schemas/WindowState"
                  openCount:
                    type: integer
                    description: The number of all open windows, including those cut off by the cap.
                  overdueCount:
                    type: integer
                    description: The number of all überschritten windows, including those cut off by the cap.
                  outdoorTemperature:
                    type: number
                    format: double
                    description: The latest stored outdoor temperature reading in °C; missing without a reading.
                  staleDateIsoTimeStamp:
                    type: string
                    description: The earliest Fensterschließzeit among all windows not yet überschritten; missing when every window is überschritten.
                required:
                  - windowStates
                  - openCount
                  - overdueCount

  /lights/set:
    post:
      summary: Set light properties
      description: Set color and/or brightness of a light by placeId and name.
      operationId: setLightProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLightRequest"
      responses:
        "200":
          description: Light properties were set successfully.
        "400":
          description: Bad request - invalid parameters.

  /entities/state:
    put:
      summary: Set the state of a server-owned entity
      description: |
        The one general route for the app to set a state the server owns (placeId `server`). Only entities
        that are declared settable from the app are accepted; any other entity is refused and stays
        unchanged. The state holds at once: the answer and every later read show it. Asking for the value the
        entity already has changes nothing (`changed` is false). The change counts with origin `app`.
      operationId: setEntityState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEntityStateRequest"
      responses:
        "200":
          description: The state of the entity after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityState"
        "400":
          description: The value does not fit the value kind of the entity.
        "403":
          description: The entity is not settable from the app.

  /entities/history:
    get:
      summary: Get entity history
      description: Retrieve historical data for a specific entity with optional time range and pagination.
      operationId: getEntityHistory
      parameters:
        - name: placeId
          in: query
          description: The place identifier of the entity
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: The name of the entity
          required: true
          schema:
            type: string
        - name: characteristicsName
          in: query
          description: Optional characteristics name of the entity
          required: false
          schema:
            type: string
        - name: characteristicType
          in: query
          description: The characteristic type of the entity
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: ISO 8601 timestamp for the start of the time range (inclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: ISO 8601 timestamp for the end of the time range (exclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: ISO 8601 timestamp cursor for pagination (fetch items older than this)
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of history items to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: includePrevious
          in: query
          description: Append the last state before startDate as the oldest item (only on the last page)
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A success response with entity history data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityHistoryResponse"
        "400":
          description: Bad request - invalid parameters.

  /entities/history/room:
    get:
      summary: Get the history of a room
      description: Retrieve the history of all entities in one place, at most 1000 items per entity, newest first.
      operationId: getRoomHistory
      parameters:
        - name: placeId
          in: query
          description: The place identifier of the room
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: ISO 8601 timestamp for the start of the time range (inclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: ISO 8601 timestamp for the end of the time range (exclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: includePrevious
          in: query
          description: Append the last state before startDate as the oldest item of each entity
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The history of every entity in the room.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityHistory"

  /heating/overview:
    get:
      summary: Get the heating overview
      description: |
        Per room with a heating automation: actual value, plan target and the source of the actual value.
        Δ is actual minus plan target. Empty when no room is configured.
      operationId: getHeatingOverview
      responses:
        "200":
          description: The rooms of the overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingOverview"

  /heating/rooms/{placeId}:
    get:
      summary: Get the detail of a heating room
      description: |
        The time grid of one room: actual value, plan target and one valve percentage per radiator.
        The grid has 5 minute steps (30 minutes for 7d) and ends now.
      operationId: getHeatingRoom
      parameters:
        - name: placeId
          in: path
          description: The place identifier of the room
          required: true
          schema:
            type: string
        - name: range
          in: query
          description: "One of 2h, 24h or 7d; 24h when omitted. Any other value answers 400."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The detail of the room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingRoomDetail"
        "400":
          description: Unknown range.
        "404":
          description: The room has no heating automation.

  /heating/fireplace:
    get:
      summary: Get the state of the fireplace
      description: |
        The fireplace mode is a state the server keeps itself; no HomeKit switch stands behind it.
        `since` is when it went on, `endsAt` when the server switches it off (the fireplace's maximum duration, two hours, after `since`).
      operationId: getFireplace
      responses:
        "200":
          description: The state of the fireplace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fireplace"
    put:
      summary: Switch the fireplace on or off
      description: |
        Used by the Heizung tab and the push action "Kamin an?". Asking for the state it already has changes
        nothing, so a second "on" does not restart that duration. The new state holds at once: the answer and
        every later GET show it, and the rooms that follow the fireplace react right away.
      operationId: setFireplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireplaceRequest"
      responses:
        "200":
          description: The state of the fireplace after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fireplace"

components:
  schemas:
    Automation:
      type: object
      properties:
        name:
          type: string
          description: The name of the automation.
        isActive:
          type: boolean
          description: Indicates if the automation is active.
        isRunning:
          type: boolean
          description: Indicates if the automation is currently running.
        type:
          type: string
          description: Type name of the automation, e.g. MotionAtNight.
        recordsRuns:
          type: boolean
          description: Whether runs of this automation are recorded.
        lastRun:
          $ref: "#/components/schemas/AutomationRun"
        entities:
          type: array
          description: All entities the automation reads or controls.
          items:
            $ref: "#/components/schemas/EntityId"
      required:
        - name
        - isActive
        - isRunning

    AutomationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        automationName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        trigger:
          $ref: "#/components/schemas/AutomationTrigger"
        outcome:
          type: string
          enum: [running, completed, superseded, stopped, failed, interrupted]
        errorDescription:
          type: string
      required:
        - id
        - automationName
        - startedAt
        - trigger
        - outcome

    AutomationTrigger:
      type: object
      properties:
        kind:
          type: string
          enum: [entityChange, time, sunrise, sunset, serverStart, configDeploy, fireplace]
        entityId:
          $ref: "#/components/schemas/EntityId"
        summary:
          type: string
          description: Human-readable description of what triggered the run.
      required:
        - kind
        - summary

    PushDevice:
      type: object
      properties:
        deviceName:
          type: string
          description: The name of the device that created this token.
        tokenString:
          type: string
          description: The token string for push notifications.
        tokenType:
          type: string
          enum: [pushNotification, liveActivityStart, liveActivityUpdate]
          description: The type of the push notification.
        activityType:
          type: string
          description: Type of the activity (e.g., WindowAttributes) - only available for tokens of type "liveActivityUpdate".
      required:
        - deviceName
        - tokenString
        - tokenType

    WindowState:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier of the window, derived from its entity.
        name:
          type: string
          description: The name of the window, without the room.
        room:
          type: string
          description: The room the window is in.
        openedIsoTimeStamp:
          type: string
          description: The ISO timestamp when the window was opened.
        closeByIsoTimeStamp:
          type: string
          description: The ISO timestamp by which the window has to be closed (Fensterschließzeit).
        isOverdue:
          type: boolean
          description: Set by the server once the window's Fensterschließzeit has passed (überschritten).
      required:
        - id
        - name
        - room
        - openedIsoTimeStamp
        - closeByIsoTimeStamp
        - isOverdue

    EntityId:
      type: object
      properties:
        placeId:
          type: string
          description: The identifier of the place.
        name:
          type: string
          description: The name of the entity.
        characteristicsName:
          type: string
          description: Optional name of the characteristic (may be empty).
        characteristicType:
          type: string
          description: The type of characteristic.
      required:
        - placeId
        - name
        - characteristicType

    SetEntityStateRequest:
      type: object
      properties:
        entityId:
          $ref: "#/components/schemas/EntityId"
        value:
          description: The new value; its shape follows the value kind (boolean, number or text).
          oneOf:
            - type: boolean
            - type: number
            - type: string
      required:
        - entityId
        - value

    EntityState:
      type: object
      properties:
        entityId:
          $ref: "#/components/schemas/EntityId"
        valueKind:
          type: string
        value:
          description: The state after the request.
          oneOf:
            - type: boolean
            - type: number
            - type: string
        changed:
          type: boolean
          description: False when the entity already had this value.
        origin:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - entityId
        - valueKind
        - value
        - changed

    SetLightRequest:
      type: object
      properties:
        placeId:
          type: string
          description: The place identifier (e.g. room name).
        name:
          type: string
          description: The name of the light entity.
        hexColor:
          type: string
          description: Hex color string (e.g. "#FF0000" or "FF0000").
        brightness:
          type: integer
          minimum: 0
          maximum: 100
          description: Brightness level 0-100.
      required:
        - placeId
        - name

    EntityHistory:
      type: object
      properties:
        entityId:
          $ref: "#/components/schemas/EntityId"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityHistoryItem"
      required:
        - entityId
        - items

    EntityHistoryItem:
      type: object
      properties:
        valueKind:
          type: string
          description: The value kind of this point (the raw value of a characteristic type, e.g. `temperatureSensor`). A kind the app does not know is shown with its raw value.
        value:
          description: The generic value of this point, a boolean, a number or a text; its shape follows the value kind (colour is the text "r g b" with components 0...1).
          oneOf:
            - type: boolean
            - type: number
            - type: string
        timestamp:
          type: string
          format: date-time
          description: The ISO timestamp of this historical data point.
        origin:
          type: string
          description: Where the change came from, `homekit`, `server` or the name of a polling job. Absent for an item that is no single change, such as an hourly aggregate.
        lastReport:
          type: string
          format: date-time
          description: When the entity last reported, a replay included, next to `timestamp`, the time of the last change. Only on the newest item of a history and only while the server holds it in memory; absent after a restart until the first report.
      required:
        - timestamp

    EntityHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityHistoryItem"
          description: Array of historical data points.
        nextCursor:
          type: string
          format: date-time
          description: Cursor for the next page of results (timestamp of the last item, or null if no more data).
      required:
        - items

    HeatingRoomDetail:
      type: object
      required: [placeId, name, range, istSource, radiators, samples]
      properties:
        placeId:
          type: string
        name:
          type: string
        range:
          type: string
          description: 2h, 24h or 7d
        istSource:
          $ref: "#/components/schemas/HeatingIstSource"
        radiators:
          type: array
          description: Radiator names in a stable order; the valves of a sample follow it.
          items:
            type: string
        samples:
          type: array
          items:
            $ref: "#/components/schemas/HeatingSample"
        lastIst:
          type: string
          format: date-time
          description: When the room last had an actual value, also before the range; missing when it never had one.
        events:
          type: array
          description: Events of the range sorted by pin; one that began before the range keeps its real start and pins at the range start.
          items:
            $ref: "#/components/schemas/HeatingEvent"
    HeatingEvent:
      type: object
      required: [source, title, reason, start, pin]
      properties:
        source:
          type: string
          description: plan, window, fireplace, observed or system
        title:
          type: string
        reason:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Missing for a moment and while the event lasts.
        pin:
          type: string
          format: date-time
          description: Pin position inside the range.
    Fireplace:
      type: object
      required: [isOn]
      properties:
        isOn:
          type: boolean
        since:
          type: string
          format: date-time
          description: When the fireplace went on; missing while it is off.
        endsAt:
          type: string
          format: date-time
          description: When the server switches it off; missing while it is off. Clients show this value instead of computing it.
    FireplaceRequest:
      type: object
      required: [isOn]
      properties:
        isOn:
          type: boolean
    HeatingOverview:
      type: object
      required: [rooms, heatmap]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/HeatingOverviewRoom"
        heatmap:
          type: array
          description: Room x day x six-hour segment for the last seven local days (Europe/Berlin), today included.
          items:
            $ref: "#/components/schemas/HeatingHeatmapCell"
    HeatingHeatmapCell:
      type: object
      required: [placeId, day, segment]
      properties:
        placeId:
          type: string
        day:
          type: string
          format: date-time
          description: Start of the local day.
        segment:
          type: integer
          description: 0 = 0-6, 1 = 6-12, 2 = 12-18, 3 = 18-24 o'clock local time.
        delta:
          type: [number, "null"]
          format: double
          description: Mean delta of the segment; null when more than half of it has no actual value.
    HeatingOverviewRoom:
      type: object
      required: [placeId, name, shortName, istSource, followsFireplace]
      properties:
        placeId:
          type: string
        name:
          type: string
        shortName:
          type: string
          description: The label under the bar.
        ist:
          type: [number, "null"]
          format: double
          description: Actual value now; null or missing while there is none (the generated Swift server omits it).
        sollPlan:
          type: [number, "null"]
          format: double
          description: Plan target now; null when unknown.
        delta:
          type: [number, "null"]
          format: double
          description: Actual minus plan target; null when one of them is null.
        istSource:
          $ref: "#/components/schemas/HeatingIstSource"
        followsFireplace:
          type: boolean
          description: Whether the room follows the fireplace (flame and orange area while it burns).
    HeatingIstSource:
      type: object
      required: [kind, names]
      properties:
        kind:
          type: string
          enum: [roomSensor, thermostats]
          description: Where the actual value comes from.
        names:
          type: array
          items:
            type: string
    HeatingSample:
      type: object
      required: [date, valves]
      properties:
        date:
          type: string
          format: date-time
        ist:
          type: [number, "null"]
          format: double
          description: Actual value; null while there is none.
        sollPlan:
          type: [number, "null"]
          format: double
          description: Plan target; null when unknown.
        valves:
          type: array
          description: Valve opening in percent per radiator; null while silent.
          items:
            type: [number, "null"]
            format: double
